<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel | Achou Oferta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand" href="index.html"><span class="brand-mark">A</span><span>Achou <strong>Oferta</strong></span></a>
      <nav class="admin-nav">
        <button class="active">Produtos</button>
        <a href="index.html" target="_blank" rel="noopener">Ver site ↗</a>
      </nav>
    </aside>

    <main class="admin-content">
      <div class="admin-top">
        <div>
          <h1>Painel de produtos</h1>
          <p>Cadastre ofertas e cole seus links de afiliado.</p>
        </div>
        <button id="newProductBtn" class="primary-btn">+ Novo produto</button>
      </div>

      <section class="stats-grid">
        <article class="stat-card"><span>Produtos</span><strong id="statProducts">0</strong></article>
        <article class="stat-card"><span>Destaques</span><strong id="statFeatured">0</strong></article>
        <article class="stat-card"><span>Cliques registrados</span><strong id="statClicks">0</strong></article>
        <article class="stat-card"><span>Categorias</span><strong id="statCategories">0</strong></article>
      </section>

      <section class="admin-card">
        <div class="admin-card-header">
          <h2>Catálogo</h2>
          <div class="admin-actions">
            <button id="exportBtn" class="secondary-btn">Exportar JSON</button>
            <label class="secondary-btn" for="importInput" style="cursor:pointer">Importar JSON</label>
            <input id="importInput" type="file" accept="application/json" hidden>
            <button id="resetBtn" class="danger-btn">Restaurar padrão</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Produto</th><th>Categoria</th><th>Loja</th><th>Preço</th><th>Cliques</th><th>Destaque</th><th>Ações</th></tr></thead>
            <tbody id="productRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="productModal" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Novo produto</h2>
        <button id="closeModal" class="close-btn" aria-label="Fechar">×</button>
      </div>
      <form id="productForm" class="form-grid">
        <input type="hidden" id="productId">
        <div class="field full"><label for="name">Nome do produto</label><input id="name" required placeholder="Ex.: iPhone 16 128 GB"></div>
        <div class="field"><label for="category">Categoria</label><input id="category" required placeholder="Ex.: Celulares"></div>
        <div class="field"><label for="store">Loja parceira</label><input id="store" required placeholder="Ex.: Mercado Livre"></div>
        <div class="field"><label for="price">Preço atual (R$)</label><input id="price" type="number" min="0" step="0.01" required placeholder="0,00"></div>
        <div class="field"><label for="oldPrice">Preço anterior (R$)</label><input id="oldPrice" type="number" min="0" step="0.01" placeholder="Opcional"></div>
        <div class="field"><label for="emoji">Emoji</label><input id="emoji" placeholder="📱"></div>
        <div class="field"><label for="featured">Destaque</label><select id="featured"><option value="true">Sim</option><option value="false">Não</option></select></div>
        <div class="field full"><label for="image">URL da imagem</label><input id="image" type="url" placeholder="https://... (opcional)"></div>
        <div class="field full"><label for="link">Link da oferta / afiliado</label><input id="link" type="url" required placeholder="https://..."></div>
        <div class="form-foot"><button type="button" id="cancelBtn" class="secondary-btn">Cancelar</button><button type="submit" class="primary-btn">Salvar produto</button></div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="products.js"></script>
  <script src="admin.js"></script>
</body>
</html>
