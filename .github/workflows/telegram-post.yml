name: Post to Telegram

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post next product to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-post.js

      - name: Commit updated state
        run: |
          git config user.name "achou-oferta-bot"
          git config user.email "actions@github.com"
          git add telegram-state.json
          git diff --cached --quiet || git commit -m "chore: update telegram post state [skip ci]"
          git push
